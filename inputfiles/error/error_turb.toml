# Error model of the turbulent-only BFM wall model: a regressor of the baseline error
# eps = pi_out,true - pi_out,baseline (raw baseline output), trained with the Gaussian negative log-likelihood (NLL);
# it predicts the correction mean mu and the aleatoric (data) uncertainty sigma.
#
# Train with (from the repository root):
#   python train_turb.py --error error/error_turb.toml [--sngp sngp/sngp_turb.toml] [--gpu N] [--smoke]
#
# Training data: the baseline's train/valid split plus the 80/20 split of the additional datasets (the same
# split as the SNGP when [data] and Seed agree). Inputs and targets are z-scored with the combined train data;
# the statistics are saved as assets/error_norm_stats.json (legacy format read by the exporters and CharLES tools).

[general]
# Output directory name under SaveDir (required). Reference model (./models/error/, read-only), for comparison:
#   error_model_Baseline_cleanedupNew_Add_ExpertExtFlow_CustomLayers_N60xL15_wVal_ep3811
#   ('ep3811' = best validation epoch of a 10000-epoch run, restored at the end of training)
ModelName = "error_model_turb_v2"
SaveDir   = "./models/error"   # directory receiving <ModelName>/ (SavedModel + assets/) and checkpoints/<ModelName>/ (snapshots)
Save      = true         # false: train and write diagnostics only
Overwrite = false        # true: replace an existing <SaveDir>/<ModelName> and its snapshots
GpuNum    = 0            # GPU index for TensorFlow and torch; -1 = CPU (the CLI option --gpu overrides it)
Seed      = 1234         # seeds the splits, weight initialisation and shuffling (required)

[baseline]
# Baseline wall-model checkpoint (path relative to ./models, e.g. baseline/<file>.pth, or any path; required); must equal the SNGP TOML's when both
# are trained together.
Checkpoint = "baseline/cleaned_up_20251208_ymax_0_15_ymin_0_0025.pth"

[data]
# Additional datasets added to the error-model training data. [] = none. The list below is the external-flow
# set of the reference model ('ExpertExtFlow' in its name).
AddDatasets = ["Transition_transition", "curved_TBL_APG", "curved_TBL_FPG", "hump_FPG", "hump_FPG_SEP",
               "hump_APG_SEP2", "naca_0012", "naca_4412_1", "naca_4412_2", "naca_4412_4", "naca_4412_10",
               "aairfoil_2M"]
TrainRatio = 0.8         # fraction of the additional-data points in the train part (seeded 80/20 split)
upy   = 0.15             # n1/delta <= upy for the additional datasets (>= 1: no upper cut); 0.15 = the checkpoint's upy
downy = 0.0              # n1/delta >= downy (honoured whenever > 0); 0 = no lower cut

[data.Files]
# Optional explicit h5 paths for dataset keys not found in ./data

[model]
HiddenLayers = [60, 60, 60, 60, 60, 60, 60, 60, 60, 60, 60, 60, 60, 60, 60]   # 15 x 60 ReLU layers (required).
                         # CharLES hard-codes width 60 and 15 (turb) / 6 (lam) layers.
SigmaFloor   = 1.0e-4    # sigma = SigmaFloor + softplus(o2) (CharLES hard-codes 1e-4)

[training]
Epochs          = 10000      # epochs (required). The reference 'ep3811' model is the best epoch of a 10000-epoch run.
BatchSize       = 50000      # samples per step
LearningRate    = 1.0e-3     # Adam learning rate at epoch 1 ...
EndLearningRate = 8.0e-5     # ... decaying linearly per epoch to this value ...
DecayFraction   = 0.6666667  # ... over this fraction of Epochs (2/3, as for the reference models), then constant

[training.EarlyStopping]
RestoreBestWeights = true    # keep the weights of the best val_loss epoch (tf_keras restores them at the end of
                             # training even without an early stop; this is how 'ep3811' was produced)
Patience = 0                 # epochs without val_loss improvement before stopping; 0 = never stop early
MinDelta = 0.0               # minimum val_loss decrease counted as an improvement

[training.Snapshots]
SaveInterval = 1000          # full SavedModel every N epochs in <SaveDir>/checkpoints/<ModelName>/ckpt_XXXX; 0 = off

[plots.input_space]
# Diagnostics: the error model's predictions over the network-input planes pi_1-pi_2 and pi_1-pi_3 (pi_1 = u1 n1/nu,
# pi_2 = up n1/nu, pi_3 = u2 n1/nu) of its train and validation splits, one figure per split, metric and axis scale
# with both planes side by side: results/training/<ModelName>/input_space/<train|valid>_<metric>_<symlog|linear>.png.
# Written after training, or for a saved model with --plots-only.
Sets    = "both"                 # "train", "valid", "both" or "none"
Metrics = ["sigma", "sigma_pct", "mu", "mu_pct"]
                                 # sigma / mu: predicted aleatoric / epistemic error (pi_out units; |mu| plotted);
                                 # *_pct: in % of |pi_out,baseline|, with the LowValue blend below
LowValue = { Threshold = 2.0, Delta = 1.0 }   # below |pi_out,baseline| 2 +- 1 the % is relative to sqrt(|pi_1|) instead
                                 # (as [gates.LowValue] of the test TOMLs)
TrainingBackground = false       # true: draw the training split in black behind the validation split
BackgroundAlpha    = 0.1         # opacity of the background points
Scale     = "symlog"             # axes: "symlog" (logarithmic in |pi|, linear within +-LinThresh), "linear" or "both"
LinThresh = 1.0                  # linear range of the symlog axes
LinearLimits = { Pi1 = [-5000.0, 20000.0], Pi2 = [-200.0, 200.0], Pi3 = [-5000.0, 20000.0] }   # linear axis limits
SymlogLimits = { Pi1 = [], Pi2 = [], Pi3 = [] }   # symlog axis limits ([] = data range)
MarkerSize   = 1.0               # scatter marker size
PercentRange = [1.0, 100.0]      # logarithmic colour range of sigma% and |mu|%
SigmaRange   = []                # logarithmic colour range of sigma ([] = 1st-99th percentile of the plotted points)
MuRange      = []                # logarithmic colour range of |mu| ([] = 1st-99th percentile)
