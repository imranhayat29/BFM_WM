# SNGP confidence models of the laminar-turbulent BFM wall model (one per branch: laminar and turbulent).
#
# Train with (from the repository root):
#   python train_lamturb.py --sngp sngp/sngp_lamturb.toml [--error error/error_lamturb.toml] [--branch lam|turb|both]
#
# [lam] and [turb] are each a complete config with the keys of sngp/sngp_turb.toml (see the comments there).
# The shared [general] table below is inherited by both branches where they don't set a key; ModelName must be
# set per branch. Kt/Km is not used in training (the lam/turb hard switch is applied at test time / in CharLES).

[general]
SaveDir   = "./models/sngp"   # directory receiving <ModelName>/
Save      = true         # false: train and write diagnostics only
Overwrite = false        # true: replace existing model directories
GpuNum    = 0            # GPU index; -1 = CPU (the CLI option --gpu overrides it)
Seed      = 1234         # seeds splits, weights, shuffling and dropout

# =====================================================================================================
# Laminar branch: laminar baseline (FS_ZPG/APG/FPG) + laminar A-airfoil additional data
# =====================================================================================================
[lam.general]
# Reference model (./models/sngp/, read-only), for comparison:
#   sngp_model_Baseline_selftrained_lam_Add_ExpertExtFlowUPY0p8_ep20000_merged
ModelName = "sngp_model_lam_v2"

[lam.baseline]
Checkpoint = "baseline/NN_wm_CH0_G0_S0_tn560665_vn140167_fds0_lds0_customw1_inputs2_final_ep30000_tl0.00032144_vl0.00031670.pth"

[lam.data]
# Laminar regions of the A-airfoil 2M case (h5 case names aairfoil_laminar_{ZPG,APG,FPG}), n1/delta in [0.02, 0.8]
AddDatasets = ["aairfoil_2M_full2Dfield_down0p02_up0p8_laminar_ZPG",
               "aairfoil_2M_full2Dfield_down0p02_up0p8_laminar_APG",
               "aairfoil_2M_full2Dfield_down0p02_up0p8_laminar_FPG"]
TrainRatio = 0.8         # seeded 80/20 split of the additional data
upy   = 0.8              # n1/delta <= 0.8 (the reference model's 'UPY0p8' tag)
downy = 0.0              # no lower cut
DownsampleBaseline = 10  # every 10th baseline train/valid point (as for the reference model)
RecomputeNorm = true     # z-score stats over (strided baseline + additional) train data (as for the reference model)

[lam.data.Files]
# Optional explicit h5 paths

[lam.classes]
NumClasses    = 30       # GP output units (CharLES expects 30 for the laminar SNGP)
RemoveClasses = []       # no class removed
DisplayNames  = {}       # identity (the class names are already descriptive)
PosthocGroups = {}       # no post-hoc grouping

[lam.classes.MergeGroups]
# Each class = baseline Falkner-Skan case + airfoil laminar region of the same pressure gradient
"Laminar ZPG" = ["FS_ZPG", "aairfoil_laminar_ZPG"]
"Laminar APG" = ["FS_APG", "aairfoil_laminar_APG"]
"Laminar FPG" = ["FS_FPG", "aairfoil_laminar_FPG"]

[lam.model]
NumLayers     = 6        # CharLES-compatible architecture (see sngp_turb.toml)
NumHidden     = 128
SpecNormBound = 0.9
NumInducing   = 1024
GpKernelScale = 1.0
Dropout       = 0.1
DropoutActive = true     # false reproduces the reference models (dropout never applied)

[lam.training]
Epochs          = 20000      # epochs of the laminar reference model (ep20000)
BatchSize       = 50000
LearningRate    = 5.0e-4
EndLearningRate = 1.0e-4
DecayUnit       = "epoch"    # "step" reproduces the reference models
ClassWeights    = "balanced"

[lam.plots.input_space]
# Input-space diagnostics (keys and comments: sngp/sngp_turb.toml)
Sets    = "both"
Metrics = ["confidence", "class"]
OodThreshold       = 0.7
TrainingBackground = false
BackgroundAlpha    = 0.1
Scale     = "symlog"
LinThresh = 1.0
LinearLimits = { Pi1 = [-5000.0, 20000.0], Pi2 = [-200.0, 200.0], Pi3 = [-5000.0, 20000.0] }
SymlogLimits = { Pi1 = [], Pi2 = [], Pi3 = [] }
MarkerSize      = 1.0
ConfidenceRange = [0.0, 1.0]

# =====================================================================================================
# Turbulent branch: same recipe as sngp/sngp_turb.toml, 4000 epochs (the SNGP deployed in CharLES BFMv2)
# =====================================================================================================
[turb.general]
# Reference model (./models/sngp/, read-only), for comparison:
#   sngp_model_Baseline_cleanedupNew_Add_ExpertExtFlow_ep4000_merged
ModelName = "sngp_model_lamturb_turb_v2"

[turb.baseline]
Checkpoint = "baseline/cleaned_up_20251208_ymax_0_15_ymin_0_0025.pth"

[turb.data]
AddDatasets = ["Transition_transition", "curved_TBL_APG", "curved_TBL_FPG", "hump_FPG", "hump_FPG_SEP",
               "hump_APG_SEP2", "naca_0012", "naca_4412_1", "naca_4412_2", "naca_4412_4", "naca_4412_10",
               "aairfoil_2M"]
TrainRatio = 0.8
upy   = 0.15             # n1/delta <= 0.15 (checkpoint upy)
downy = 0.0
DownsampleBaseline = 1   # no stride
RecomputeNorm = false    # full baseline-train statistics

[turb.data.Files]

[turb.classes]
NumClasses = 50
RemoveClasses = ["SYN", "airfoil", "naca_0012_top4n12", "naca_4412_top1n", "naca_4412_top2n", "naca_4412_top4n",
                 "naca_4412_top10n"]

[turb.classes.MergeGroups]
APG = ["gaussian_2M_MAPG", "gaussian_2M_APG", "TBL_5", "TBL_10", "TBL_15", "TBL_20"]
FPG = ["gaussian_2M_FPG", "TBL_-4", "TBL_-3", "TBL_-2", "TBL_-1"]
SEP = ["gaussian_2M_SEP", "bub_K"]
"NASA Hump FPG" = ["FPG"]
"NASA Hump SEP" = ["APG_SEP2", "FPG_SEP"]
"Curved BL FPG" = ["curved_BL_FPG"]
"Curved BL APG" = ["curved_BL_APG"]

[turb.classes.DisplayNames]
APG = "Turbulent APG"
FPG = "Turbulent FPG"
SEP = "Turbulent Separation"
CH = "ZPG TBL"
FS_ZPG = "Viscous ZPG"
FS_APG = "Viscous APG"
FS_FPG = "Viscous FPG"
transition_JHU_transition = "Transition BL"
"APG TBL" = "APG TBL"
"FPG TBL" = "FPG TBL"
Separation = "Separation"

[turb.classes.PosthocGroups]
"APG TBL" = ["APG", "Curved BL APG"]
"FPG TBL" = ["FPG", "NASA Hump FPG", "Curved BL FPG"]
"Separation" = ["SEP", "NASA Hump SEP"]

[turb.model]
NumLayers     = 6
NumHidden     = 128
SpecNormBound = 0.9
NumInducing   = 1024
GpKernelScale = 1.0
Dropout       = 0.1
DropoutActive = true

[turb.training]
Epochs          = 4000       # 4000 = the reference turbulent SNGP deployed in CharLES BFMv2
BatchSize       = 50000
LearningRate    = 5.0e-4
EndLearningRate = 1.0e-4
DecayUnit       = "epoch"
ClassWeights    = "balanced"

[turb.plots.input_space]
# Input-space diagnostics (keys and comments: sngp/sngp_turb.toml)
Sets    = "both"
Metrics = ["confidence", "class"]
OodThreshold       = 0.7
TrainingBackground = false
BackgroundAlpha    = 0.1
Scale     = "symlog"
LinThresh = 1.0
LinearLimits = { Pi1 = [-5000.0, 20000.0], Pi2 = [-200.0, 200.0], Pi3 = [-5000.0, 20000.0] }
SymlogLimits = { Pi1 = [], Pi2 = [], Pi3 = [] }
MarkerSize      = 1.0
ConfidenceRange = [0.0, 1.0]
